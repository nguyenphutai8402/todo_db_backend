spring.application.name=todo

server.port=8080
server.servlet.context-path=/todo

spring.datasource.url=jdbc:mysql://localhost:3306/tododb
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

jwt.secret-key=${JWT_SECRET_KEY}
jwt.refresh-token-hash-pepper=${JWT_REFRESH_TOKEN_HASH_PEPPER}
access-token-expiration=${ACCESS_TOKEN_EXPIRATION}
refresh-token-expiration=${REFRESH_TOKEN_EXPIRATION}

app.cookie.refresh-name=refreshToken
app.cookie.refresh-path=/todo/api/auth
app.cookie.same-site=Lax
app.cookie.secure=false

app.jobs.token-cleanup-cron=0 0 3 * * *
app.jobs.time-zone=Asia/Ho_Chi_Minh
